name: Get Citation Data

on:
  # Daily refresh + manual runs only. The `page_build` trigger was removed:
  # it fired a full ~20-30 min scholarly crawl on every deploy, and with
  # cancel-in-progress disabled those runs queued up behind each other.
  # The citation badge is fetched live from the google-scholar-stats branch,
  # so it does not need refreshing on every build.
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: get-citation-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Reqs
        run: |
          sudo apt-get install -y python3-setuptools

      - name: Run
        run: |
          cd ./google_scholar_crawler
          python3 -m pip install -r requirements.txt
          python3 main.py
          cd ./results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          git diff --cached --quiet || git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
