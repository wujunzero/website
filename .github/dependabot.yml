version: 2
updates:
  # The workflows pin actions to commit SHAs (supply-chain hardening).
  # This keeps those pins current — without it they would silently go stale.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  # Gemfile.lock now governs the deploy (the site is built by GitHub Actions),
  # so gem updates here take effect on the published site.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gems:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # The citation crawler's Python dependencies.
  - package-ecosystem: pip
    directory: "/google_scholar_crawler"
    schedule:
      interval: monthly
    ignore:
      # `bibtexparser<2` is deliberate, not an oversight.
      # Verified against the published sdists: scholarly 1.5.1 AND 1.7.11 both
      # import the bibtexparser *v1* API —
      #   from bibtexparser.bibdatabase import BibDatabase
      #   bibtexparser.bparser.BibTexParser(...)
      # bibtexparser 2.x removed both modules. Relaxing the pin to `<3` (which
      # Dependabot proposed as PR #14) reintroduces the ModuleNotFoundError that
      # broke the crawler for weeks. Never accept a major bump here until
      # scholarly migrates to the v2 API.
      - dependency-name: bibtexparser
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
