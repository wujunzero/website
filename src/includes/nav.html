<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | url }}">{{ site.name }}</a>

    <nav class="nav-links" id="site-nav" aria-label="Main">
      <a href="{{ '/#about' | url }}">About</a>
      <a href="{{ '/#news' | url }}">News</a>
      <a href="{{ '/#publications' | url }}">Publications</a>
      <a href="{{ '/#projects' | url }}">Projects</a>
      <a href="{{ '/#teaching' | url }}">Teaching</a>
      <a class="menu-only" href="mailto:{{ site.email }}">{{ site.email }}</a>
    </nav>

    <div class="nav-actions">
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch colour theme"
        title="Switch colour theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" />
        </svg>
      </button>

      <button type="button" class="icon-btn menu-btn" id="menu-toggle" aria-expanded="false"
        aria-controls="site-nav" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>
</header>
