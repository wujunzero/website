<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | url }}">{{ site.name }}</a>

    <nav class="nav-links" id="site-nav" aria-label="Main">
      <a href="{{ '/#about' | url }}">About</a>
      <a href="{{ '/#news' | url }}">News</a>
      <a href="{{ '/#publications' | url }}">Publications</a>
      <a href="{{ '/#projects' | url }}">Projects</a>
      <a href="{{ '/#teaching' | url }}">Teaching</a>
      <a class="menu-only" href="mailto:{{ site.email }}">{{ site.email }}</a>
    </nav>

    <div class="nav-actions">
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Colour theme: system"
        title="Colour theme: system">
        <svg class="theme-system" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"
          focusable="false">
          <circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor" />
        </svg>
        <svg class="theme-light" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"
          focusable="false">
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg class="theme-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"
          focusable="false">
          <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.4 8.4 0 1 0 10.5 10.5z" stroke="currentColor"
            stroke-width="1.6" stroke-linejoin="round" />
        </svg>
      </button>

      <button type="button" class="icon-btn menu-btn" id="menu-toggle" aria-expanded="false"
        aria-controls="site-nav" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>
</header>
